<nav class="sidebar">
  <div class="sidebar-header">
    <div class="logo">
      <span class="logo-icon">
        <mat-icon>bolt</mat-icon>
      </span>
      <span class="logo-text">JacksFit</span>
    </div>
  </div>

  <div class="nav-items">
@for (item of navItems; track item.path) {
<a class="nav-item"
  [routerLink]="item.path"
  routerLinkActive="active"
  [routerLinkActiveOptions]="{ exact: true }"
  [matTooltip]="item.label"
  matTooltipPosition="right">
  <mat-icon>{{ item.icon }}</mat-icon>
  <span class="nav-label">{{ item.label }}</span>
</a>
}
  </div>

  <div class="sidebar-footer">
    <button class="nav-item theme-toggle" (click)="toggleTheme()"
      [matTooltip]="isDark ? 'Switch to light' : 'Switch to dark'"
      matTooltipPosition="right">
      <mat-icon>{{ isDark ? 'light_mode' : 'dark_mode' }}</mat-icon>
      <span class="nav-label">{{ isDark ? 'Light mode' : 'Dark mode' }}</span>
    </button>

    <div class="user-row">
      <div class="avatar">{{ getInitials() }}</div>
      <div class="user-info">
        <span class="user-name">{{ displayName }}</span>
      </div>
      <button mat-icon-button (click)="logout()"
        matTooltip="Sign out" matTooltipPosition="right">
        <mat-icon>logout</mat-icon>
      </button>
    </div>
  </div>
</nav>
